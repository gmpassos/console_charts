name: console_charts
description: >-
  Charts for the console and terminal, rendered as plain text. Sparklines, line
  and bar charts, gauges, heatmaps and dashboards. No dart:io, so it works on the
  web too, and no dependencies.
version: 0.2.0
repository: https://github.com/gmpassos/console_charts
issue_tracker: https://github.com/gmpassos/console_charts/issues

topics:
  - charts
  - console
  - terminal
  - cli
  - visualization

environment:
  sdk: ^3.13.5

dev_dependencies:
  dependency_validator: ^5.0.6
  lints: ^6.0.0
  test: ^1.25.6
