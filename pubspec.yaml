name: console_charts
description: >-
  Charts for the console and terminal, rendered as plain text. Sparklines, line
  and bar charts, gauges, heatmaps and dashboards. No dart:io, so it works on the
  web too, and no dependencies.
version: 0.1.0
repository: https://github.com/omnyGrid/console_charts

topics:
  - charts
  - console
  - terminal
  - cli
  - visualization

environment:
  sdk: ^3.13.5

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
